<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/main.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <header>
        <h1>Simulador de Productos</h1>
        <p>Gestioná productos y consultá su información</p>
    </header>

    <main>
        <section class="productos">
            <h2>Productos</h2>

            <div id="listaProductos" class="lista-productos"></div>
        </section>

        <section class="acciones">
            <h2>¿Qué querés hacer?</h2>

            <div class="botones">
                <button id="btnBuscar">Buscar producto</button>
                <button id="btnDisponibles">Ver disponibles</button>
                <button id="btnNombres">Ver nombres</button>
                <button id="btnComprar">Comprar producto</button>
            </div>
        </section>

        <section class="resultado">
            <h2>Resultado</h2>
            <div id="resultado"></div>
        </section>
    </main>

    <footer>
        <p>Simulador de productos - Pre-entrega 6</p>
    </footer>


</body>

</html>
